---
# ── Shared media-stack configuration ──
timezone: Europe/Paris
media_puid: 1000
media_pgid: 1000

# Host paths
media_root: /data                              # ext4 media drive (from the storage role)
stacks_root: /home/stacks                      # single parent for every compose project (Dockge manages subdirs here)
media_stack_dir: "{{ stacks_root }}/media-stack" # compose + .env live here
media_stack_appdata: /home/media-stack/appdata # per-service /config bind mounts (kept in place — live data, not moved)
media_owner: beelink
media_group: beelink

# ── VPN ──
vpn_server_countries: Netherlands

# GPU groups for Jellyfin Quick Sync (from: getent group render video)
jellyfin_render_gid: 992
jellyfin_video_gid: 44

# services will be jellyfin.home, sonarr.home, etc.
local_domain: home

# Shared cross-stack docker network (created by the docker role). Pinned rather than
# left to docker's auto-allocation because gluetun's firewall has to name the subnet
# explicitly — an auto-assigned range could change on recreate and silently cut
# qBittorrent's WebUI off from Uptime Kuma, which probes it by container name.
homelab_subnet: 172.23.0.0/16