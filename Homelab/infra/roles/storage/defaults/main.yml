---
# The external media drive, pinned by its UNIQUE by-id path (never /dev/sdX, which can move).
storage_device: /dev/disk/by-id/usb-Seagate_Expansion_HDD_00000000NC18006G-0:0
storage_partition: "{{ storage_device }}-part1"

storage_mount: /data
storage_fstype: ext4

# media_owner / media_group are NOT defined here: eight roles share them, so they live in
# inventory/group_vars/all/vars.yml. They used to be duplicated in this file, where the
# group_vars copy silently won and these values were dead weight.
