---
# Mount-only path — safe on every converge. Partitioning and mkfs live in provision.yml,
# which nothing but playbooks/storage-provision.yml pulls in. They used to run from here
# on every site.yml, where one empty blkid reply was enough to flip `force` on and wipe
# a drive holding 272 GB of media. Keep this file free of anything that writes to the disk.

- name: Safety — verify the media partition is present
  ansible.builtin.stat:
    path: "{{ storage_partition }}"
  register: _media_part

- name: Safety — abort if the media partition is missing
  ansible.builtin.assert:
    that: _media_part.stat.exists
    fail_msg: >-
      Media partition {{ storage_partition }} not found — is the drive plugged in?
      On a brand-new disk, run playbooks/storage-provision.yml once first.

- name: Read the media partition's UUID
  ansible.builtin.command: "blkid -s UUID -o value {{ storage_partition }}"
  register: _media_uuid
  changed_when: false

- name: Mount the media drive at {{ storage_mount }} by UUID (persisted to fstab)
  ansible.posix.mount:
    path: "{{ storage_mount }}"
    src: "UUID={{ _media_uuid.stdout }}"
    fstype: "{{ storage_fstype }}"
    opts: defaults,nofail
    state: mounted

- name: Create the media directory tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ media_owner }}"
    group: "{{ media_group }}"
    mode: "0775"
  loop:
    - "{{ storage_mount }}/torrents"
    - "{{ storage_mount }}/torrents/movies"
    - "{{ storage_mount }}/torrents/tv"
    - "{{ storage_mount }}/media"
    - "{{ storage_mount }}/media/movies"
    - "{{ storage_mount }}/media/tv"
