---
# ── Identity stack: one directory of users, one login for the media stack ──
# Two layers, and both are needed because the apps differ in what they can do:
#   LLDAP    — the DIRECTORY. Holds users, passwords and groups ("who exists").
#   Authelia — the SESSION. Runs the login portal and answers NPM's auth
#              subrequest on every request ("are you logged in right now").
#
# Scope is the media stack ONLY. administration/monitoring/adguard/glance keep
# their own logins on purpose — that keeps Dockge + Dozzle reachable on their
# plain host ports if this stack ever breaks, so a bad auth config never costs
# you hands on the machine.
lldap_image: lldap/lldap:latest
authelia_image: ghcr.io/authelia/authelia:latest

# Host paths (compose under the shared stacks_root; appdata alongside the other stacks)
identity_dir: "{{ stacks_root }}/identity"
identity_appdata: /home/identity/appdata

# Published ports.
# Only LLDAP's admin UI is published — it's where you add users, so you need it
# reachable even if NPM is down. LDAP (3890) and Authelia (9091) stay INTERNAL and
# are reached over the `homelab` network by container name; nothing else needs them.
lldap_web_port: 17170

# ── Naming ────────────────────────────────────────────────────────────────────
# The SSO session cookie has to be readable by every protected hostname, so they
# all sit under ONE shared two-label suffix. Browsers refuse to set cookies on a
# single-label domain, which is why `.home` alone cannot work: sonarr.home and
# radarr.home share only "home", and a cookie on "home" is rejected outright.
# Adding one label fixes it — sonarr.media.home and radarr.media.home share
# "media.home", which is a legal cookie domain, so one login covers them all.
#
# The existing *.home names and the AdGuard rewrite are untouched by this.
# `sso_domain` and `sso_base_dn` are defined in inventory/group_vars/all/vars.yml,
# not here — the glance role renders them too, and role defaults are not in scope
# when a playbook runs that role on its own.

# Session lifetimes. `inactivity` closes an idle session; `expiration` is the hard
# cap even if you keep using it. Both are deliberately generous for a LAN-only stack.
authelia_session_expiration: 12 hours
authelia_session_inactivity: 2 hours

# Brute-force regulation: N failures inside find_time locks the account for ban_time.
authelia_max_retries: 3
authelia_find_time: 2 minutes
authelia_ban_time: 5 minutes

# Certificate lifetimes. The leaf is capped at 825 days because browsers reject
# longer-lived server certificates outright, even from a CA you trust yourself.
identity_ca_days: "+3650d"
identity_cert_days: "+825d"
