---
# ── Webapps stack: the self-hosted applications that aren't media ──
# Mealie (recipes and meal planning) and Seshat (ebook library).
#
# Mealie keeps its own login on its own published port. Seshat has no login and stays open
# on the LAN; it publishes no port and is reached by name through NPM's seshat.home host.
mealie_image: ghcr.io/mealie-recipes/mealie:latest

# Host paths (compose under the shared stacks_root; appdata alongside the other stacks)
webapps_dir: "{{ stacks_root }}/webapps"
webapps_appdata: /home/webapps/appdata

# Published on purpose — this app is reached by IP:port on the LAN, not through NPM,
# so there is no forward-auth gate to bypass.
mealie_port: 9925

# ── Seshat (ebook library) ──
# GitLab CI publishes releases to the project's private registry (:vX.Y.Z and
# :latest on a version tag). CI never deploys: Watchtower picks up a new :latest
# on its weekly run, or run this playbook with -e seshat_update=true to pull now.
# Pulling needs a read_registry deploy token in the vault
# (vault_seshat_registry_user / vault_seshat_registry_token).
seshat_registry: registry.gitlab.com
seshat_image: "{{ seshat_registry }}/xaelbaseth/project-seshat:latest"
seshat_update: false
seshat_library_path: "{{ media_root }}/books"   # books + SQLite dbs, on the ext4 media drive
seshat_max_upload_mb: 500
seshat_max_concurrent_conversions: 2

# ── Seshat backups ──
# Databases + covers only (book files come back from their sources), on the system
# SSD so a failing media drive doesn't take the backups with it.
seshat_backup_dir: /home/backups/seshat
seshat_backup_keep: 14                        # daily snapshots, ~26 MB each
seshat_backup_schedule: "*-*-* 03:30:00"      # systemd OnCalendar
