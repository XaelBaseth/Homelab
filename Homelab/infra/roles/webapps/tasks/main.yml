---
- name: Create the webapps stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ media_owner }}"
    group: "{{ media_group }}"
    mode: "0755"
  loop:
    - "{{ webapps_dir }}"
    - "{{ webapps_appdata }}"
    - "{{ webapps_appdata }}/mealie"      # Mealie's /app/data — SQLite db, recipe images, backups

- name: Render the stack environment file (secrets from the vault)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ webapps_dir }}/.env"
    owner: "{{ media_owner }}"
    group: "{{ media_group }}"
    mode: "0600"
  notify: Restart webapps containers

- name: Render the docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ webapps_dir }}/docker-compose.yml"
    owner: "{{ media_owner }}"
    group: "{{ media_group }}"
    mode: "0644"

- name: Deploy the webapps stack
  # remove_orphans is what actually deletes the linkding and docs containers: they are
  # no longer in the compose file, so compose treats them as orphans of this project.
  community.docker.docker_compose_v2:
    project_src: "{{ webapps_dir }}"
    state: present
    remove_orphans: true
