---
- name: Create the webapps stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ media_owner }}"
    group: "{{ media_group }}"
    mode: "0755"
  loop:
    - "{{ webapps_dir }}"
    - "{{ webapps_appdata }}"
    - "{{ webapps_appdata }}/mealie"      # Mealie's /app/data — SQLite db, recipe images, backups
    - "{{ seshat_library_path }}"          # Seshat's /data/libraries — runs as PUID, so owned by it

# ── Seshat image: built on the workstation, shipped here (no registry) ──
# Compared by image ID rather than tag, so rebuilding under the same tag still ships.
- name: Read the Seshat image on the workstation
  ansible.builtin.command: docker image inspect {{ seshat_image }}
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  check_mode: false
  register: seshat_local_image

- name: Read the Seshat image on the host
  community.docker.docker_image_info:
    name: "{{ seshat_image }}"
  register: seshat_remote_image

- name: Compare the two image IDs
  ansible.builtin.set_fact:
    seshat_local_id: "{{ (seshat_local_image.stdout | from_json)[0].Id }}"
    seshat_remote_id: "{{ seshat_remote_image.images[0].Id if seshat_remote_image.images else '' }}"
    seshat_tarball: /tmp/seshat-image.tar

- name: Ship the Seshat image
  when: seshat_local_id != seshat_remote_id
  block:
    - name: Save the image on the workstation
      ansible.builtin.command: docker save -o {{ seshat_tarball }} {{ seshat_image }}
      delegate_to: localhost
      become: false

    - name: Copy the image tarball to the host
      ansible.builtin.copy:
        src: "{{ seshat_tarball }}"
        dest: "{{ seshat_tarball }}"
        mode: "0600"

    - name: Load the image
      community.docker.docker_image_load:
        path: "{{ seshat_tarball }}"

  always:
    - name: Remove the tarball from the host
      ansible.builtin.file:
        path: "{{ seshat_tarball }}"
        state: absent

    - name: Remove the tarball from the workstation
      ansible.builtin.file:
        path: "{{ seshat_tarball }}"
        state: absent
      delegate_to: localhost
      become: false

- name: Render the stack environment file (secrets from the vault)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ webapps_dir }}/.env"
    owner: "{{ media_owner }}"
    group: "{{ media_group }}"
    mode: "0600"
  notify: Restart webapps containers

- name: Render the docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ webapps_dir }}/docker-compose.yml"
    owner: "{{ media_owner }}"
    group: "{{ media_group }}"
    mode: "0644"

- name: Deploy the webapps stack
  # remove_orphans is what retires a container dropped from the compose file: compose
  # treats it as an orphan of this project and deletes it on the next converge.
  community.docker.docker_compose_v2:
    project_src: "{{ webapps_dir }}"
    state: present
    remove_orphans: true
