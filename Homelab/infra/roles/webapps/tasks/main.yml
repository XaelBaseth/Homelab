---
- name: Create the webapps stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ media_owner }}"
    group: "{{ media_group }}"
    mode: "0755"
  loop:
    - "{{ webapps_dir }}"
    - "{{ webapps_appdata }}"
    - "{{ webapps_appdata }}/mealie"      # Mealie's /app/data — SQLite db, recipe images, backups
    - "{{ seshat_library_path }}"          # Seshat's /data/libraries — runs as PUID, so owned by it

# ── Seshat image: pulled from the private GitLab registry ──
- name: Check the Seshat registry token is in the vault
  ansible.builtin.assert:
    that:
      - vault_seshat_registry_user is defined
      - vault_seshat_registry_token is defined
    fail_msg: >-
      Create a GitLab deploy token (project-seshat > Settings > Repository > Deploy tokens,
      scope read_registry) and add vault_seshat_registry_user / vault_seshat_registry_token
      with `ansible-vault edit inventory/group_vars/all/vault.yml`.
    quiet: true

# Written to /root/.docker/config.json: compose pulls with it, and Watchtower reads
# the same directory (administration role).
- name: Log in to the Seshat registry
  community.docker.docker_login:
    registry_url: "{{ seshat_registry }}"
    username: "{{ vault_seshat_registry_user }}"
    password: "{{ vault_seshat_registry_token }}"
  no_log: true

# Opt-in, so a routine converge never changes the running version behind your back.
- name: Pull the latest Seshat release
  when: seshat_update | bool
  community.docker.docker_image:
    name: "{{ seshat_image }}"
    source: pull
    force_source: true

- name: Render the stack environment file (secrets from the vault)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ webapps_dir }}/.env"
    owner: "{{ media_owner }}"
    group: "{{ media_group }}"
    mode: "0600"
  notify: Restart webapps containers

- name: Render the docker-compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ webapps_dir }}/docker-compose.yml"
    owner: "{{ media_owner }}"
    group: "{{ media_group }}"
    mode: "0644"

- name: Deploy the webapps stack
  # remove_orphans is what retires a container dropped from the compose file: compose
  # treats it as an orphan of this project and deletes it on the next converge.
  community.docker.docker_compose_v2:
    project_src: "{{ webapps_dir }}"
    state: present
    remove_orphans: true
