---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Ensure locale is generated
  community.general.locale_gen:
    name: "{{ common_locale }}"
    state: present

- name: Set system timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Create the shared stacks root (single parent for every compose project)
  ansible.builtin.file:
    path: "{{ stacks_root }}"
    state: directory
    owner: "{{ media_owner }}"
    group: "{{ media_group }}"
    mode: "0755"

- name: Give the LAN interface a static address
  # Written now, applied at the next reboot — deliberately not live: swapping ifupdown from
  # dhcp to static under a running dhcpcd, over the very SSH link it carries, is how you lose
  # the box. Same IP as the old Livebox reservation, so an early reboot changes nothing.
  ansible.builtin.template:
    src: interfaces.j2
    dest: /etc/network/interfaces
    owner: root
    group: root
    mode: "0644"
    backup: true

- name: Pin the host's own DNS resolvers
  # With no DHCP client left, nothing else writes this file (resolvconf isn't installed).
  # Until the reboot above, dhcpcd still rewrites it on lease renewal — expect "changed".
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (common role) — upstreams only, never AdGuard on this host.
      {% for ns in common_host_dns %}
      nameserver {{ ns }}
      {% endfor %}

- name: Harden SSH
  block:
    - name: Deploy SSH hardening drop-in
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-hardening.conf
        owner: root
        group: root
        mode: "0644"
        backup: true
        content: |
          # Managed by Ansible (common role)
          PubkeyAuthentication yes
          PasswordAuthentication no
          PermitRootLogin no
          AllowUsers {{ ansible_user }}
          MaxAuthTries 3
          X11Forwarding no
      notify: Restart ssh

    - name: Validate the complete sshd configuration
      ansible.builtin.command: sshd -t
      changed_when: false
  rescue:
    - name: Roll back the hardening drop-in (config failed validation)
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/99-hardening.conf
        state: absent
    - name: Abort with a clear message
      ansible.builtin.fail:
        msg: "sshd config was invalid — hardening removed, nothing applied. SSH untouched."

# Security patches only, nightly. Point releases and the Docker repo stay with the manual
# `update.yml` run: Docker upgrades restart every container, so they are never unattended.
# Reboots stay manual too — a new kernel or libc waits for one.
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Turn on the nightly apt jobs
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by Ansible (common role)
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

- name: Limit unattended upgrades to Debian security
  # Sorts after the package's 50unattended-upgrades. Lists in apt.conf append, so `#clear`
  # first drops the stock origins (which also take point releases) before setting ours.
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-homelab
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by Ansible (common role)
      #clear Unattended-Upgrade::Origins-Pattern;
      Unattended-Upgrade::Origins-Pattern {
          "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
          "origin=Debian,codename=${distro_codename},label=Debian-Security";
      };
      // Belt and braces: the Docker repo isn't in the patterns above anyway.
      Unattended-Upgrade::Package-Blacklist {
          "^docker-";
          "^containerd\.io$";
      };
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Automatic-Reboot "false";
