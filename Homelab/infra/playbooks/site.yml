---
- name: Provision Beelink media server
  hosts: beelink
  become: true
  roles:
    - common
    - firewall
    - storage
    - docker
    - socket_proxy  # before glance/monitoring/administration: creates the docker-api network they join
    - media_stack
    - webapps       # also joins the `homelab` network, created by the docker role
    - glance
    - monitoring
    - administration
    - adguard
    - languard      # after adguard: it reads AdGuard's query log
