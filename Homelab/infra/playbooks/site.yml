---
- name: Provision Beelink media server
  hosts: beelink
  become: true
  roles:
    - common
    - storage
    - docker
    - identity      # before media_stack: creates the `homelab` network both stacks join
    - media_stack
    - webapps       # also joins the `homelab` network, so it follows identity too
    - glance
    - monitoring
    - administration
    - adguard